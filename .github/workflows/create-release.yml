---
# https://github.com/wayofdev/gh-actions/blob/master/.github/workflows/create-release.yml
# https://github.com/google-github-actions/release-please-action#release-types-supported
# https://github.com/googleapis/release-please/blob/main/docs/customizing.md

on: # yamllint disable-line rule:truthy
  push:
    branches:
      - 1.x

name: 📦 Create release

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: 🎉 Create release
        uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: .github/.release-please-config.json
          manifest-file: resources/version.json
          target-branch: 1.x

      # Refresh the Vibe Index badge on the open release PR so it ships with the
      # release. Runs only while the release PR exists; the badge change is
      # reviewed and merged together with it.
      - name: 🛒 Checkout release PR branch
        if: ${{ steps.release.outputs.prs_created == 'true' }}
        uses: actions/checkout@v7
        with:
          ref: ${{ fromJSON(steps.release.outputs.pr).headBranchName }}
          fetch-depth: 0 # the action needs the full git history

      - name: ✨ Update Vibe Index badge
        if: ${{ steps.release.outputs.prs_created == 'true' }}
        uses: roxblnfk/action-vibe-index@v1
        with:
          update-files: "README.md, README-zh.md, README-ru.md, README-es.md"
          # No commit/push here: the action pushes to the trigger branch (1.x),
          # not the checked-out PR branch. Commit & push below with plain git,
          # which targets the current PR branch.

      - name: 💾 Commit & push the badge to the release PR
        if: ${{ steps.release.outputs.prs_created == 'true' }}
        run: |
          git diff --quiet && { echo "Badge already up to date."; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: update Vibe Index badge"
          git push

  # The asset builds are called directly instead of listening for
  # `release: published`. A release cut by GITHUB_TOKEN emits no such event, so
  # a workflow triggered by it would never start.
  phar:
    name: 📦 PHAR
    needs: release
    if: ${{ needs.release.outputs.release_created == 'true' }}
    permissions:
      contents: write
    uses: ./.github/workflows/build-phar-release.yml
    with:
      tag: ${{ needs.release.outputs.tag_name }}
    secrets: inherit

  binaries:
    name: 📦 Binaries
    needs: release
    if: ${{ needs.release.outputs.release_created == 'true' }}
    permissions:
      contents: write
    uses: ./.github/workflows/buld-bin-release.yml
    with:
      tag: ${{ needs.release.outputs.tag_name }}
    secrets: inherit
...
